[package]
name = "immigration-ai-mobile"
version = "0.1.0"
description = "비자 행정사용 RAG AI 챗봇 — 모바일판"
edition = "2021"
rust-version = "1.77"

[lib]
# 모바일 타깃은 cdylib/staticlib 필수 (Android .so / iOS static lib).
name = "immigration_ai_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
pdf-extract = "0.9"

# rustls + 번들 루트 인증서: 모바일 크로스컴파일에서 OpenSSL 의존 회피.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
] }

# 데스크탑(개발·테스트) 자격증명: OS 키체인. 모바일은 아래 타깃별 구현 사용.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "linux-native",
] }

# iOS: Keychain Services 직접 호출.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"

# Android: JNI 로 AndroidKeyStore(AES-GCM) + SharedPreferences 조합.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# pdf-extract 는 debug 빌드에서 매우 느림 → 의존성만 최적화.
[profile.dev.package."*"]
opt-level = 3
