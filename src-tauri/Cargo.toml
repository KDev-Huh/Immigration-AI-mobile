# wry 0.55.1 의 iOS 크래시 우회 — `platform_webview_version()` 이 시스템 소유 번들에
# `unload()` 를 호출해 앱 실행 즉시 죽는다. 벤더 사본에서 그 한 줄만 제거했다.
# 업스트림(tauri-apps/wry) 수정이 릴리스되면 이 patch 와 vendor/wry 를 삭제할 것.
# 근거: docs/adr/0003-wry-ios-patch.md
[patch.crates-io]
wry = { path = "vendor/wry" }

[package]
name = "immigration-ai-mobile"
version = "0.1.0"
description = "비자 행정사용 RAG AI 챗봇 — 모바일판"
edition = "2021"
rust-version = "1.77"

[lib]
# 모바일 타깃은 cdylib/staticlib 필수 (Android .so / iOS static lib).
name = "immigration_ai_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
pdf-extract = "0.9"

# rustls + 번들 루트 인증서: 모바일 크로스컴파일에서 OpenSSL 의존 회피.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls-webpki-roots",
] }

# 데스크탑(개발·테스트) 자격증명: OS 키체인. 모바일은 아래 타깃별 구현 사용.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "linux-native",
] }

# iOS: Keychain Services 직접 호출.
[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3"

# Android: JNI 로 AndroidKeyStore(AES-GCM) + SharedPreferences 조합.
# wry 는 이미 의존 트리에 있지만, JavaVM/Activity 를 얻는 `prelude::dispatch` 를
# 직접 쓰기 위해 명시적 의존으로 올린다 (Tauri v2 는 ndk-context 를 초기화하지 않음).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
base64 = "0.22"
wry = "0.55"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# pdf-extract 는 debug 빌드에서 매우 느림 → 의존성만 최적화.
[profile.dev.package."*"]
opt-level = 3
