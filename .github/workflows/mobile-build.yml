name: Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "GitHub Release 생성/업로드"
        type: boolean
        default: false
      tag:
        description: "수동 릴리즈 태그 (예: v0.1.0)"
        type: string
        default: ""

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    # 시크릿은 잡 레벨 env 로 올려야 스텝의 `if:` 에서 참조할 수 있다.
    # (스텝 자신의 env 는 그 스텝의 if 평가 시점에 아직 없다.)
    env:
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r25c

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # gen/ 은 커밋하지 않으므로 CI 에서 매번 생성한다.
      - name: Android 프로젝트 생성
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          npm run tauri android init
          # init 이 심어놓은 Tauri 기본 런처 아이콘의 지문을 기록해둔다.
          sha256sum src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
            | cut -d' ' -f1 > /tmp/default-icon.sha

      # 반드시 init **다음**이어야 한다. gen/ 을 커밋하지 않으므로 이 단계를 빼면
      # 릴리즈 APK 가 매번 Tauri 기본 아이콘으로 나간다.
      - name: 앱 아이콘 반영
        run: |
          set -euo pipefail
          npm run icon
          AFTER=$(sha256sum src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
                  | cut -d' ' -f1)
          if [ "$AFTER" = "$(cat /tmp/default-icon.sha)" ]; then
            echo "::error::런처 아이콘이 Tauri 기본값 그대로입니다 — assets/app-icon.png 가 반영되지 않았습니다"
            exit 1
          fi
          echo "런처 아이콘 반영 확인됨"

      # 서명 시크릿이 있을 때만 릴리즈 서명을 붙인다.
      - name: 업로드 키 구성
        if: env.ANDROID_KEY_BASE64 != ''
        run: |
          cd src-tauri/gen/android
          echo "$ANDROID_KEY_BASE64" | base64 -d > upload.jks
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/upload.jks
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          EOF

      - name: 빌드 (설치용 APK)
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          WANT_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release == true }}
        run: |
          set -euo pipefail
          if [ "$WANT_RELEASE" = "true" ] && [ -n "$ANDROID_KEY_BASE64" ]; then
            npm run tauri android build -- --apk --aab
          else
            npm run tauri android build -- --debug --apk
          fi

      - name: 릴리즈 파일 정리
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          KIND="debug"
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            KIND="release"
          fi

          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | sort | head -1)"
          if [ -z "$APK" ]; then
            echo "APK 산출물을 찾지 못했습니다." >&2
            exit 1
          fi

          cp "$APK" "release-assets/immigration-ai-mobile-${RELEASE_TAG}-android-${KIND}.apk"

          AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' 2>/dev/null | sort | head -1 || true)"
          if [ -n "$AAB" ]; then
            cp "$AAB" "release-assets/immigration-ai-mobile-${RELEASE_TAG}-android-${KIND}.aab"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

      - name: GitHub Release 업로드
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release == true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$RELEASE_TAG" = "main" ] || [ "$RELEASE_TAG" = "master" ] || [ -z "$RELEASE_TAG" ]; then
            echo "수동 실행으로 Release를 만들 때는 tag 입력값(예: v0.1.0)이 필요합니다." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --title "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
